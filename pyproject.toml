[project]
name = "jarvis-agent"
version = "0.1.0"
description = "JARVIS - persönlicher KI-Assistent (Mistral Agents SDK) mit Signal-REST-Bridge, als verwaltete Bereitstellung auf Mistral Cloud"
requires-python = ">=3.12"
dependencies = [
    "mistralai-agents>=1.1.0",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
# bewusst schlank: nur echte Fehler (Pyflakes F + Syntax E9), kein Reformat-Storm
select = ["E9", "F"]

[tool.mistralai.agents]
entrypoint = "main:agent"
