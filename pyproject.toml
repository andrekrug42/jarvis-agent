[project]
name = "jarvis-agent"
version = "0.1.0"
description = "JARVIS - persönlicher KI-Assistent (Mistral Agents SDK) mit Signal-REST-Bridge, als verwaltete Bereitstellung auf Mistral Cloud"
requires-python = ">=3.12"
dependencies = [
    "mistralai-agents>=1.1.0",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "mypy>=1.11",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # lange Zeilen (v. a. lange String-Literale) nicht anfassen

[tool.ruff.lint.isort]
known-first-party = ["agent_tools", "bridge", "bridge_worker", "main", "signal_client", "state_store"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
follow_imports = "normal"

[tool.mistralai.agents]
entrypoint = "main:agent"
