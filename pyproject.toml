[project]
name = "jarvis-agent"
version = "0.1.0"
description = "JARVIS - persönlicher KI-Assistent (Mistral Agents SDK) mit Signal-REST-Bridge, als verwaltete Bereitstellung auf Mistral Cloud"
requires-python = ">=3.12"
dependencies = [
    "mistralai-agents>=1.1.0",
    "httpx>=0.28",
]

[tool.uv]
package = false

[tool.mistralai.agents]
entrypoint = "main:agent"
