name: CI

on:
  push:
    branches: [main, "vibe/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (locked)
        run: uv sync --frozen --group dev
      - name: Byte-compile all modules
        run: uv run python -m py_compile main.py bridge.py bridge_worker.py agent_tools.py state_store.py signal_client.py
      - name: Ruff volle Regeln (E, F, W, I, UP, B)
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy signal_client.py state_store.py
      - name: Pytest
        run: uv run pytest -q
